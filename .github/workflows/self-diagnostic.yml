name: Self-Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - 'gnosis/reflection/**'
      - 'gnosis/core/**'
      - 'gnosis/storage/**'
      - 'tests/**'
      - '.github/workflows/self-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run reflection and persistence tests
        run: pytest -q tests/test_rule_provenance.py tests/test_causal_attribution.py tests/test_diagnostic_artifact.py tests/test_persistence.py tests/test_diagnostic_corpus.py tests/test_diagnostic_execution.py
      - name: Generate persisted Core history and diagnose it
        run: python diagnostic_corpus/generate.py
      - name: Upload self-diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-diagnostic-${{ matrix.python-version }}
          path: diagnostic_corpus/SELF-DIAGNOSTIC-0001/diagnostic.json